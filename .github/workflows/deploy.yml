name: Deploy 需恋 frontend to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch: {}

# 赋予 GITHUB_TOKEN 发布 Pages 的权限
permissions:
  contents: read
  pages: write
  id-token: write

# 同一时间只跑一个部署，避免互相覆盖
concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build (注入后端 API 地址)
        # VITE_API_BASE_URL 来自仓库 Secrets（Settings → Secrets → Actions），
        # 值为后端地址，例如 https://<你的HF用户名>-xulian.hf.space
        # 留空则前端走同源 /api（仅适合后端直接托管前端的情况）。
        run: npm run build
        env:
          VITE_API_BASE_URL: ${{ secrets.API_BASE_URL }}

      - name: SPA 回退（HTML5 History 深链接不 404）
        # GitHub Pages 不会自动把未知路径重写到 index.html，
        # 复制一份 index.html 为 404.html，让 /xulian/xxx 刷新时也能加载 SPA。
        run: cp dist/index.html dist/404.html

      - name: Setup Pages
        uses: actions/configure-pages@v4

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
